version: 2

updates:
  # Gradle dependencies
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "gradle"
    commit-message:
      prefix: "deps(gradle)"
    groups:
      kafka:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "org.apache.kafka:*"
      flink:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "org.apache.flink:*"
      confluent:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "io.confluent:*"
      protobuf:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "com.google.protobuf:*"
      testing:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "org.junit*"
          - "org.testcontainers*"
          - "org.awaitility*"

  # GitHub Actions. Every `uses:` is pinned to a full commit SHA with the version in a trailing
  # comment (`owner/action@<sha> # v1.2.3`); Dependabot bumps the SHA and the comment together.
  # "/" covers .github/workflows; the composite actions under .github/actions are listed
  # explicitly, because Dependabot does not look there on its own.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps(actions)"
