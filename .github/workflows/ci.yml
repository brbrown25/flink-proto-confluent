name: CI

# Canonical post-merge pipeline. Runs on push only: pull requests are covered by
# pr-checks.yml, so no task runs twice for the same commit on the same JDK.
on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
      - '.gitignore'
  workflow_dispatch:

# Only the newest run per branch matters; supersede anything still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # Single job on the primary JDK: build, unit tests, integration tests and
  # coverage all execute exactly once against one compiled output.
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    # The canonical post-merge job is the only writer of the Gradle cache; it
    # warms the entry that every PR job restores read-only.
    - name: Setup build environment
      uses: ./.github/actions/setup-build
      with:
        cache-read-only: false

    - name: Build with Gradle
      run: ./gradlew build -x test -x integrationTest

    - name: Run unit and integration tests with coverage verification
      run: ./gradlew test integrationTest jacocoTestReport jacocoTestCoverageVerification
      env:
        TESTCONTAINERS_RYUK_DISABLED: true

    - name: Generate unit test report
      uses: dorny/test-reporter@v3
      if: success() || failure()
      with:
        name: Unit Test Results
        path: build/test-results/test/*.xml
        reporter: java-junit

    - name: Generate integration test report
      uses: dorny/test-reporter@v3
      if: success() || failure()
      with:
        name: Integration Test Results
        path: build/test-results/integrationTest/*.xml
        reporter: java-junit

    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results
        path: |
          build/test-results/test/
          build/test-results/integrationTest/
          build/reports/tests/

    - name: Upload coverage report
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: coverage-report
        path: build/reports/jacoco/test/

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: build/reports/jacoco/test/jacocoTestReport.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  checkstyle:
    name: checkstyle
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup build environment
      uses: ./.github/actions/setup-build

    - name: Run lint (checkstyle, SpotBugs, Spotless)
      run: ./gradlew checkstyleMain checkstyleTest checkstyleIntegrationTest spotbugsMain spotbugsTest spotlessCheck

    - name: Upload lint results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: lint-results
        path: build/reports/checkstyle/
