name: CI

# Canonical post-merge pipeline. Runs on push only: pull requests are covered by
# pr-checks.yml, so no task runs twice for the same commit on the same JDK.
on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
      - '.gitignore'
  workflow_dispatch:

# Only the newest run per branch matters; supersede anything still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # One job per Flink line on the primary JDK: build, unit tests, integration
  # tests and coverage all execute exactly once per line against one compiled
  # output. Only the Flink 1.20 leg verifies coverage and uploads to Codecov,
  # so Codecov sees a single report per commit.
  build:
    name: build (flink ${{ matrix.flink }})
    env:
      # Checked by FlinkLineGuardTest: the run must really be on this Flink version.
      EXPECTED_FLINK_VERSION: ${{ matrix.flink }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flink: ['1.20.5', '2.2.1']
        include:
          - flink: '1.20.5'
            coverage: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    # The canonical post-merge job is the only writer of the Gradle cache; it
    # warms the entry that every PR job restores read-only. setup-gradle keys
    # the entry by job and matrix values, so each Flink leg writes its own
    # entry and the two legs never overwrite each other.
    - name: Setup build environment
      uses: ./.github/actions/setup-build
      with:
        cache-read-only: false

    - name: Build with Gradle against Flink ${{ matrix.flink }}
      run: ./gradlew -PflinkVersion=${{ matrix.flink }} build -x test -x integrationTest

    - name: Run unit and integration tests with coverage verification
      if: matrix.coverage
      run: ./gradlew -PflinkVersion=${{ matrix.flink }} test integrationTest jacocoTestReport jacocoTestCoverageVerification
      env:
        TESTCONTAINERS_RYUK_DISABLED: true

    # `test` is finalized by jacocoTestReport; excluding it keeps the non-coverage
    # leg to one run of each suite with no report.
    - name: Run unit and integration tests
      if: ${{ !matrix.coverage }}
      run: ./gradlew -PflinkVersion=${{ matrix.flink }} test integrationTest -x jacocoTestReport
      env:
        TESTCONTAINERS_RYUK_DISABLED: true

    - name: Generate unit test report
      uses: dorny/test-reporter@v3
      if: success() || failure()
      with:
        name: Unit Test Results (flink ${{ matrix.flink }})
        path: build/test-results/test/*.xml
        reporter: java-junit

    - name: Generate integration test report
      uses: dorny/test-reporter@v3
      if: success() || failure()
      with:
        name: Integration Test Results (flink ${{ matrix.flink }})
        path: build/test-results/integrationTest/*.xml
        reporter: java-junit

    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results-flink${{ matrix.flink }}
        path: |
          build/test-results/test/
          build/test-results/integrationTest/
          build/reports/tests/

    - name: Upload coverage report
      uses: actions/upload-artifact@v7
      if: always() && matrix.coverage
      with:
        name: coverage-report
        path: build/reports/jacoco/test/

    - name: Upload coverage to Codecov
      if: matrix.coverage
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: build/reports/jacoco/test/jacocoTestReport.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true

  checkstyle:
    name: checkstyle (flink ${{ matrix.flink }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flink: ['1.20.5', '2.2.1']

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup build environment
      uses: ./.github/actions/setup-build

    - name: Run lint (checkstyle, SpotBugs, Spotless)
      run: ./gradlew -PflinkVersion=${{ matrix.flink }} checkstyleMain checkstyleTest checkstyleIntegrationTest spotbugsMain spotbugsTest spotlessCheck

    - name: Upload lint results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: lint-results-flink${{ matrix.flink }}
        path: build/reports/checkstyle/
