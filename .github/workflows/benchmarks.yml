name: Benchmarks

# Runs the JMH benchmarks (src/jmh) on demand and uploads the results. Not a required check and
# never triggered by a push or pull request: shared runners are too noisy for a pass/fail gate, so
# the numbers are for comparing runs, not for blocking merges. See
# docs/content/reference/benchmarks.md.
on:
  workflow_dispatch:
    inputs:
      flink:
        description: 'Flink version to build and benchmark against; empty uses flink1.version from gradle.properties'
        required: false
        default: ''
      includes:
        description: 'Benchmarks to run (regex, comma-separated); empty runs all'
        required: false
        default: ''
      fork:
        description: 'JMH forks per benchmark'
        required: false
        default: '1'
      iterations:
        description: 'JMH measurement iterations'
        required: false
        default: '5'
      warmupIterations:
        description: 'JMH warmup iterations'
        required: false
        default: '3'

permissions:
  contents: read

jobs:
  jmh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup build environment
        uses: ./.github/actions/setup-build

      - name: Resolve the Flink version
        id: flink
        env:
          INPUT: ${{ inputs.flink }}
        run: |
          set -euo pipefail
          .github/scripts/flink-versions.sh > "$RUNNER_TEMP/flink-versions"
          primary=$(sed -n 's/^primary=//p' "$RUNNER_TEMP/flink-versions")
          echo "version=${INPUT:-$primary}" >> "$GITHUB_OUTPUT"

      - name: Run JMH
        env:
          FLINK: ${{ steps.flink.outputs.version }}
          INCLUDES: ${{ inputs.includes }}
          FORK: ${{ inputs.fork }}
          ITERATIONS: ${{ inputs.iterations }}
          WARMUP_ITERATIONS: ${{ inputs.warmupIterations }}
        run: >-
          ./gradlew jmh
          "-PflinkVersion=$FLINK"
          "-Pjmh.includes=$INCLUDES"
          "-Pjmh.fork=$FORK"
          "-Pjmh.iterations=$ITERATIONS"
          "-Pjmh.warmupIterations=$WARMUP_ITERATIONS"

      - name: Summarize results
        if: always()
        run: |
          if [ -f build/results/jmh/human.txt ]; then
            {
              echo '```'
              sed -n '/^Benchmark /,$p' build/results/jmh/human.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jmh-results-flink-${{ steps.flink.outputs.version }}
          path: build/results/jmh/
          if-no-files-found: warn
