name: PR Checks

# Owns all pull-request signal. ci.yml is push-only, so nothing here is a
# repeat of it: each task runs once per JDK and Flink line per PR.
on:
  pull_request:
    types: [opened, synchronize, reopened]

# A new push to a PR cancels the pipeline for the superseded commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # Single source of truth for "does this PR touch anything buildable?". Every
  # heavy job gates on it, so a docs-only PR reports each check as a skip
  # rather than leaving a required check pending forever.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      # The Flink version of each supported line, read from gradle.properties (#249).
      flink-matrix: ${{ steps.flink.outputs.matrix }}
      flink-primary: ${{ steps.flink.outputs.primary }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Read the Flink versions from gradle.properties
      id: flink
      run: .github/scripts/flink-versions.sh

    - name: Detect non-documentation changes
      id: filter
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
        echo "Changed files:"
        printf '%s\n' "$changed"
        code=$(printf '%s\n' "$changed" \
          | grep -vE '(^docs/|\.md$|^LICENSE$|^NOTICE$|^\.gitignore$)' || true)
        # OptionsDocumentationTest checks the option tables on these pages against the code, so
        # editing them needs the unit tests.
        options_docs=$(printf '%s\n' "$changed" \
          | grep -E '^docs/content/(reference/configuration|how-to/catalog)\.md$' || true)
        code="$code$options_docs"
        if [ -n "$code" ]; then
          echo 'code=true' >> "$GITHUB_OUTPUT"
        else
          echo 'code=false' >> "$GITHUB_OUTPUT"
          echo '::notice title=Docs-only change::Skipping build, test and coverage jobs.'
        fi

  # Lint per Flink line: SpotBugs analyses the bytecode compiled against that
  # line's Flink classes, so a 2.x-only finding cannot slip through.
  lint:
    name: lint (flink ${{ matrix.flink }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        flink: ${{ fromJSON(needs.changes.outputs.flink-matrix) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup build environment
      uses: ./.github/actions/setup-build

    - name: Run lint (checkstyle, SpotBugs, Spotless)
      run: ./gradlew -PflinkVersion=${{ matrix.flink }} checkstyleMain checkstyleTest checkstyleIntegrationTest spotbugsMain spotbugsTest spotlessCheck

    # Checkstyle sees the same sources on every line; annotate once. Runs after
    # a lint failure too, which is when the annotations matter most. Workflow
    # commands need no token and no third-party code (#238).
    - name: Annotate Checkstyle issues
      if: ${{ !cancelled() && matrix.flink == needs.changes.outputs.flink-primary }}
      run: |
        shopt -s nullglob
        python3 .github/scripts/checkstyle-annotations.py build/reports/checkstyle/*.xml

  dependency-review:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Dependency Review
      uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
      with:
        fail-on-severity: high

  # One leg per supported Flink line. Each leg compiles and packages against
  # that line's Flink artifacts (-PflinkVersion picks the line, see #142).
  build-check:
    name: build (flink ${{ matrix.flink }})
    env:
      # Checked by FlinkLineGuardTest: the run must really be on this Flink version.
      EXPECTED_FLINK_VERSION: ${{ matrix.flink }}
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        flink: ${{ fromJSON(needs.changes.outputs.flink-matrix) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup build environment
      uses: ./.github/actions/setup-build

    - name: Build against Flink ${{ matrix.flink }}
      run: ./gradlew -PflinkVersion=${{ matrix.flink }} build -x test -x integrationTest

    # `build` already runs verifyJars through `check`; this runs it by name so the packaging
    # contract (thin library JAR, relocated self-contained -all JAR) shows up as its own step.
    - name: Check JAR contents
      run: |
        ./gradlew -PflinkVersion=${{ matrix.flink }} verifyJars
        ls -l build/libs

  # Public API compatibility per Flink line (#220): japicmp compares the thin JAR with the line's
  # last release on Maven Central and fails on a binary or source incompatible change, unless the
  # pull request declares a breaking change (`!` after the type/scope in the title or a commit
  # subject, or a `BREAKING CHANGE:` footer), which makes release-please bump the major version.
  # A line with no release yet skips the comparison. The title is read from the API rather than the
  # event payload, so re-running the job after adding `!` to the title picks it up.
  api-compat:
    name: api compatibility (flink ${{ matrix.flink }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        flink: ${{ fromJSON(needs.changes.outputs.flink-matrix) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Test the breaking-change detection
      run: .github/scripts/breaking-change-declared.test.sh

    - name: Detect a declared breaking change
      id: breaking
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        title=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json title --jq .title)
        status=0
        git log --format='%B%x1e' "$BASE_SHA..$HEAD_SHA" \
          | .github/scripts/breaking-change-declared.sh "$title" || status=$?
        case "$status" in
          0) echo 'declared=true' >> "$GITHUB_OUTPUT" ;;
          1) echo 'declared=false' >> "$GITHUB_OUTPUT" ;;
          *) exit "$status" ;;
        esac

    - name: Setup build environment
      uses: ./.github/actions/setup-build

    - name: Check API compatibility against the last release (Flink ${{ matrix.flink }})
      run: ./gradlew -PflinkVersion=${{ matrix.flink }} japicmp -Pjapicmp.acceptBreaking=${{ steps.breaking.outputs.declared }}

    - name: Add the report to the job summary
      if: always()
      run: |
        report=build/reports/japicmp/japicmp.md
        if [ -f "$report" ]; then
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
        else
          echo 'No API compatibility report: the comparison did not run. See the japicmp step log.' >> "$GITHUB_STEP_SUMMARY"
        fi
        if [ '${{ steps.breaking.outputs.declared }}' = 'true' ]; then
          printf '\nThis pull request declares a breaking change, so incompatible changes do not fail the check.\n' >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload API compatibility reports
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: japicmp-flink${{ matrix.flink }}
        path: build/reports/japicmp/
        if-no-files-found: ignore

  # Unit tests only, once per supported JDK x Flink line. integrationTest and
  # jacocoTestReport are excluded because `test` is wired to finalize with
  # jacocoTestReport, which depends on integrationTest -- without the
  # exclusions the integration suite would run on every matrix leg.
  #
  # Exactly one leg (JDK 21, Flink 1.20) is the coverage leg: it uploads its
  # unit-test execution data for the integration-tests coverage leg to merge.
  test-matrix:
    name: unit tests (jdk ${{ matrix.java-version }}, flink ${{ matrix.flink }})
    env:
      # Checked by FlinkLineGuardTest: the run must really be on this Flink version.
      EXPECTED_FLINK_VERSION: ${{ matrix.flink }}
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        java-version: ['17', '21']
        flink: ${{ fromJSON(needs.changes.outputs.flink-matrix) }}
        include:
          - java-version: '21'
            flink: ${{ needs.changes.outputs.flink-primary }}
            coverage: true

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup build environment
      uses: ./.github/actions/setup-build
      with:
        java-version: ${{ matrix.java-version }}

    - name: Run unit tests on JDK ${{ matrix.java-version }}, Flink ${{ matrix.flink }}
      run: ./gradlew -PflinkVersion=${{ matrix.flink }} test -x integrationTest -x jacocoTestReport

    - name: Upload test results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: test-results-jdk${{ matrix.java-version }}-flink${{ matrix.flink }}
        path: build/test-results/test/

    - name: Upload unit test coverage data
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always() && matrix.coverage
      with:
        name: jacoco-exec-coverage-leg
        path: build/jacoco/test.exec

  # Integration suite once per Flink line on the primary JDK: real Flink SQL
  # jobs on a MiniCluster against Kafka + Schema Registry, so every line gets
  # an end-to-end smoke test of the format. Only the Flink 1.20 leg merges the
  # unit-test coverage data, verifies coverage and reports it, so Codecov sees
  # exactly one upload per commit.
  integration-tests:
    name: integration tests (flink ${{ matrix.flink }})
    env:
      # Checked by FlinkLineGuardTest: the run must really be on this Flink version.
      EXPECTED_FLINK_VERSION: ${{ matrix.flink }}
    runs-on: ubuntu-latest
    needs: [changes, test-matrix]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        flink: ${{ fromJSON(needs.changes.outputs.flink-matrix) }}
        include:
          - flink: ${{ needs.changes.outputs.flink-primary }}
            coverage: true

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup build environment
      uses: ./.github/actions/setup-build

    - name: Restore unit test coverage data from the coverage leg
      if: matrix.coverage
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: jacoco-exec-coverage-leg
        path: build/jacoco

    - name: Run integration tests and verify combined coverage
      if: matrix.coverage
      run: ./gradlew -PflinkVersion=${{ matrix.flink }} integrationTest jacocoTestReport jacocoTestCoverageVerification -x test
      env:
        TESTCONTAINERS_RYUK_DISABLED: true

    - name: Run integration tests
      if: ${{ !matrix.coverage }}
      run: ./gradlew -PflinkVersion=${{ matrix.flink }} integrationTest -x test
      env:
        TESTCONTAINERS_RYUK_DISABLED: true

    - name: Generate integration test report
      uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
      if: success() || failure()
      with:
        name: Integration Test Results (flink ${{ matrix.flink }})
        path: build/test-results/integrationTest/*.xml
        reporter: java-junit

    - name: Upload integration test results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: integration-test-results-flink${{ matrix.flink }}
        path: |
          build/test-results/integrationTest/
          build/reports/tests/integrationTest/

    - name: Upload coverage to Codecov
      if: matrix.coverage
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: build/reports/jacoco/test/jacocoTestReport.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true

    - name: Add coverage to PR
      if: matrix.coverage
      uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
      with:
        paths: build/reports/jacoco/test/jacocoTestReport.xml
        token: ${{ secrets.GITHUB_TOKEN }}
        min-coverage-overall: 80
        min-coverage-changed-files: 80
        title: Code Coverage
        update-comment: true

  # The one check branch protection should require. Matrix check names carry
  # version numbers and change on every Flink/JDK bump; this name does not.
  # It runs even when upstream jobs fail or are skipped: it fails if any of
  # them failed or was cancelled, and passes when they were all skipped for a
  # docs-only PR (#117), so the required check is never left pending.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    needs: [changes, lint, build-check, api-compat, test-matrix, integration-tests]
    if: always()

    steps:
    - name: Check upstream job results
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        set -euo pipefail
        printf '%s\n' "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
        bad=$(printf '%s\n' "$RESULTS" \
          | jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")')
        if [ -n "$bad" ]; then
          echo "::error title=Required checks failed::$bad"
          exit 1
        fi
        echo 'All required jobs succeeded or were skipped for a docs-only change.'
