name: Release

# Triggered by the `vX.Y.Z` tag that release-please pushes when a release PR merges (see
# release-please.yml). Publishes one artifact per supported Flink line, all at the tag version:
#   Flink 1.x -> com.bbrownsound:flink-proto-confluent         (built with -PflinkVersion=<flink1.version>)
#   Flink 2.x -> com.bbrownsound:flink-proto-confluent-flink2  (built with -PflinkVersion=<flink2.version>)
# The Flink versions come from gradle.properties, the same ones PR checks and CI test (#249).
# Each line's library JAR and self-contained "-all" shadow JAR go to Maven Central and are attached
# to the GitHub Release that release-please already created.
#
# The tag push is the only trigger on purpose. A `release: [created]` trigger would fire a
# second, concurrent run for the same version, and both publish jobs would contend for the same
# Sonatype staging repository.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

# One publish at a time per version. Never cancel in flight: a half-published staging repository
# is worse than a slow release.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.flink.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the Flink versions from gradle.properties
        id: flink
        run: .github/scripts/flink-versions.sh

  # Every line is tested before anything is published, so a line that fails its tests cannot
  # leave the release half-published.
  build-and-test:
    runs-on: ubuntu-latest
    needs: versions
    strategy:
      fail-fast: true
      matrix:
        flink: ${{ fromJSON(needs.versions.outputs.matrix) }}
    name: build-and-test (Flink ${{ matrix.flink }})
    env:
      # Checked by FlinkLineGuardTest: the run must really be on this Flink version.
      EXPECTED_FLINK_VERSION: ${{ matrix.flink }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup build environment
        uses: ./.github/actions/setup-build

      - name: Run all tests with coverage verification
        run: ./gradlew -PflinkVersion=${{ matrix.flink }} test integrationTest jacocoTestReport jacocoTestCoverageVerification

      - name: Build and verify JARs
        run: ./gradlew -PflinkVersion=${{ matrix.flink }} jar shadowJar verifyJars verifyProtobufVersion

  publish:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup build environment
        uses: ./.github/actions/setup-build

      - name: Read the Flink versions from gradle.properties
        id: flink
        run: .github/scripts/flink-versions.sh

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing version: $VERSION"

      # One job publishes every line, one Gradle invocation per line, in order. The nexus publish
      # plugin creates a staging repository per invocation and closes/releases only the one that
      # invocation created, so the lines never touch each other's staging repository. Running the
      # lines in parallel jobs instead would put two close/release sequences for the same version
      # in flight at once. A line whose POM is already on Maven Central is skipped, so re-running a
      # release that failed part-way publishes only what is missing (Central rejects re-uploads of
      # an existing version). Central can take up to ~30 minutes to show a fresh release, so wait
      # that long before re-running after a partial failure.
      - name: Build, verify and publish each Flink line to Sonatype (Maven Central)
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          FLINK_VERSIONS: ${{ steps.flink.outputs.list }}
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for FLINK in $FLINK_VERSIONS; do
            ARTIFACT=$(./gradlew -q -PflinkVersion="$FLINK" printArtifactId | tail -1)
            echo "::group::Flink $FLINK -> com.bbrownsound:$ARTIFACT:$VERSION"
            ./gradlew -PflinkVersion="$FLINK" -Pversion="$VERSION" jar shadowJar sourcesJar javadocJar verifyJars verifyProtobufVersion
            cp "build/libs/$ARTIFACT-$VERSION"*.jar dist/
            POM_URL="https://repo1.maven.org/maven2/com/bbrownsound/$ARTIFACT/$VERSION/$ARTIFACT-$VERSION.pom"
            if curl -fsSLI "$POM_URL" >/dev/null 2>&1; then
              echo "$ARTIFACT:$VERSION is already on Maven Central; not publishing it again."
            else
              ./gradlew -PflinkVersion="$FLINK" -Pversion="$VERSION" publishSonatypePublicationToSonatypeRepository closeAndReleaseStagingRepositories
            fi
            echo "::endgroup::"
          done
          ls -l dist

      - name: Attach every line's JARs to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # release-please creates the Release and the tag together, but the tag push can reach
          # this workflow marginally before the Release object is queryable. Wait for it rather
          # than creating a duplicate.
          for attempt in 1 2 3 4 5 6; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" dist/*.jar --clobber
              echo "Attached JARs to release $TAG."
              exit 0
            fi
            echo "Release $TAG not visible yet (attempt $attempt/6); retrying in 10s."
            sleep 10
          done
          # Fallback for a hand-pushed tag (see docs/RELEASING.md): no release-please run, so no
          # Release exists and this workflow has to create one.
          echo "No release found for $TAG after 60s; creating one (hand-pushed tag?)."
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes dist/*.jar
