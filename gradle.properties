# The last version published to Maven Central. release-please owns this line and rewrites it
# in the release PR; do not edit it by hand. Snapshot and release builds both pass an explicit
# -Pversion= in CI, and a local build with no override derives the next patch -SNAPSHOT from it.
# x-release-please-start-version
releaseVersion=1.3.0
# x-release-please-end-version

# The Flink version each supported line builds, tests, snapshots and releases against. This is the
# only place they are set: PR checks, CI, snapshot and release workflows, the benchmarks workflow
# and the docs demo all read them from here (.github/scripts/flink-versions.sh, #249), so bumping a
# line here changes every one of them together.
# The build uses flink1.version unless -PflinkVersion=<v> overrides it; the major version of
# flinkVersion selects the Flink line (1 or 2), and the line selects the flink<line>.* coordinates
# below.
flink1.version=1.20.5
flink2.version=2.2.1
# Flink connectors are released per Flink line, so each line names its own connector version.
flink1.kafkaConnectorVersion=3.4.0-1.20
flink2.kafkaConnectorVersion=5.0.0-2.2
# One published artifact per Flink line, all at the same version. Line 1 keeps the original
# coordinates so existing 1.20 users are unaffected.
flink1.artifactId=flink-proto-confluent
flink2.artifactId=flink-proto-confluent-flink2
confluentVersion=8.1.1
# Published in the POM as the protobuf-java and protobuf-java-util version, so it must be the
# version the build really resolves, not a lower one that a transitive dependency then raises.
# `verifyProtobufVersion` (part of `check`) fails when the two drift apart.
protoVersion=4.33.6

# Dependency downloads that fail with a transient error (HTTP 429, 408 or 5xx, or a dropped
# connection) are retried with doubling backoff. Gradle's default is 3 tries from 1s, which a burst
# of parallel CI jobs on a cold cache exhausts within seconds when Maven Central rate-limits
# (#202). 6 tries from 2s waits 2+4+8+16+32s, about a minute, before giving up. Permanent errors
# such as 404 are not retried, so builds that never hit a transient error are unaffected.
systemProp.org.gradle.internal.repository.max.tentatives=6
systemProp.org.gradle.internal.repository.initial.backoff=2000
