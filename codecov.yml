# Codecov configuration: https://docs.codecov.com/docs/codecov-yaml
#
# Gradle's jacocoTestCoverageVerification already hard-fails the coverage job
# below 80% line coverage overall. What it cannot express is patch coverage --
# how well the lines a pull request actually changed are covered -- so a PR can
# add uncovered code and stay green while the project-wide number holds. The
# patch status below is the gate for that.
#
# Both statuses need `informational: false` to block; informational statuses
# always report success. They also only appear once the Codecov GitHub App is
# installed on the repository, and only block once they are listed as required
# status checks in the repository ruleset. See docs/ci.md.

codecov:
  # Do not judge coverage from a run whose tests did not finish.
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "80...100"

  status:
    # Project-wide coverage. Mirrors the Gradle gate so the two cannot disagree.
    project:
      default:
        target: 80%
        threshold: 0%
        informational: false
        if_ci_failed: error

    # Coverage of the lines this pull request changed.
    patch:
      default:
        target: 80%
        threshold: 0%
        informational: false
        if_ci_failed: error

comment:
  layout: "condensed_header, diff, files, footer"
  behavior: default
  require_changes: false

github_checks:
  annotations: true
